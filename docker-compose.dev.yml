# Local dev stack: API + Mini App, the bot, and an ngrok tunnel that gives the Mini App a public https URL.
#   docker compose -f docker-compose.dev.yml up --build
# Needs in .env: SL_BOT_TOKEN, SL_BOT_USERNAME, NGROK_AUTHTOKEN (and optionally NGROK_URL for a static domain).
# The ngrok inspector is at http://localhost:4040.

x-database-url: &database-url postgresql+psycopg://shopping_list:shopping_list@db:5432/shopping_list

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shopping_list
      POSTGRES_PASSWORD: shopping_list
      POSTGRES_DB: shopping_list
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_list"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: shared-lists:dev
    env_file: .env
    environment:
      SL_DATABASE_URL: *database-url
    command: ["shopping-list-bot", "migrate"]
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    image: shared-lists:dev
    env_file: .env
    environment:
      SL_DATABASE_URL: *database-url
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ngrok:
    image: ngrok/ngrok:3-alpine
    # NGROK_URL is optional: a static domain such as https://name.ngrok-free.app. Without it ngrok picks a
    # random https URL, which the bot reads from the inspector API on start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # The inspector API must listen on all interfaces so the bot container can read the tunnel URL.
      - >-
        printf 'version: "2"\nweb_addr: 0.0.0.0:4040\n' > /tmp/ngrok.yml &&
        exec ngrok http app:8000 --log stdout --config /tmp/ngrok.yml $${NGROK_URL:+--url "$$NGROK_URL"}
    env_file: .env
    ports:
      - "4040:4040"
    depends_on:
      app:
        condition: service_healthy

  bot:
    image: shared-lists:dev
    env_file: .env
    environment:
      SL_DATABASE_URL: *database-url
      NGROK_API: http://ngrok:4040/api/tunnels
    volumes:
      - ./docker/dev-bot-entrypoint.py:/app/dev-bot-entrypoint.py:ro
    command: ["python", "/app/dev-bot-entrypoint.py"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      ngrok:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
