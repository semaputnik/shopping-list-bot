[project]
name = "shopping-list-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Semaputnik", email = "semyon.putnikov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shopping-list-bot = "shopping_list_bot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
